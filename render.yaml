# Render Blueprint: the app (built from the Dockerfile) and PostgreSQL, on
# Render's free plans. New → Blueprint → pick this repository → Apply.
# The sample township loads on first start, so reviewers can sign in with the
# demo logins in deployment.md. SMS, payments and photo storage stay mocked.
services:
  - type: web
    name: township
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: township-db
          property: connectionString
      - key: FILE_URL_SECRET
        generateValue: true
      - key: DEMO_DATA
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: STORAGE
        value: local
      - key: STORAGE_DIR
        value: /app/uploads

databases:
  - name: township-db
    plan: free
    region: singapore
    databaseName: township
    user: township
    postgresMajorVersion: "16"
